<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tm-userscripts - instalacja</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2em auto; padding: 0 1em; color: #222; }
    h1 { font-size: 1.5em; }
    h2 { font-size: 1.05em; margin: 1.5em 0 0.4em; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 0.2em; }
    #search { width: 100%; box-sizing: border-box; padding: 0.6em; font-size: 1em; border: 1px solid #bbb; border-radius: 6px; }
    #status { color: #666; font-size: 0.9em; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.45em 0.2em; border-bottom: 1px solid #f0f0f0; }
    .name { font-family: ui-monospace, monospace; font-size: 0.92em; word-break: break-all; }
    .btn { flex-shrink: 0; background: #2c7be5; color: #fff; text-decoration: none; padding: 0.35em 0.9em; border-radius: 5px; font-size: 0.9em; }
    .btn:hover { background: #1a68d1; }
</style>
</head>
<body>
<h1>Skrypty Tampermonkey</h1>
<p>Kliknij <strong>Zainstaluj</strong> przy wybranym skrypcie. Tampermonkey otworzy okno instalacji (wymaga zainstalowanego rozszerzenia). Aktualizacje przychodzą automatycznie.</p>

<input id="search" type="search" placeholder="Szukaj skryptu..." autocomplete="off">
<p id="status">Ładowanie listy...</p>
<div id="list"></div>

<script>
    const OWNER = 'tage01';
    const REPO = 'tm-userscripts';
    const BRANCH = 'main';
    const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
    const TREE_API = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    let scripts = [];

    function rawUrl(path) {
        return RAW + path.split('/').map(encodeURIComponent).join('/');
    }

    function displayName(path) {
        return path.split('/').pop().replace(/\.user\.js$/, '');
    }

    function render() {
        const q = document.getElementById('search').value.trim().toLowerCase();
        const list = document.getElementById('list');
        const status = document.getElementById('status');
        list.textContent = '';

        const groups = new Map();
        let shown = 0;
        for (const path of scripts) {
            if (q && !path.toLowerCase().includes(q)) continue;
            const dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '(główny katalog)';
            if (!groups.has(dir)) groups.set(dir, []);
            groups.get(dir).push(path);
            shown++;
        }

        status.textContent = scripts.length
            ? `Skryptów: ${shown} z ${scripts.length}`
            : status.textContent;

        for (const [dir, paths] of groups) {
            const h = document.createElement('h2');
            h.textContent = dir;
            list.appendChild(h);

            for (const path of paths) {
                const row = document.createElement('div');
                row.className = 'row';

                const name = document.createElement('span');
                name.className = 'name';
                name.textContent = displayName(path);

                const btn = document.createElement('a');
                btn.className = 'btn';
                btn.textContent = 'Zainstaluj';
                btn.href = rawUrl(path);
                btn.target = '_blank';
                btn.rel = 'noopener';

                row.append(name, btn);
                list.appendChild(row);
            }
        }
    }

    async function loadScripts() {
        const status = document.getElementById('status');
        try {
            const resp = await fetch(TREE_API, { headers: { 'Accept': 'application/vnd.github+json' } });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            scripts = data.tree
                .filter(item => item.type === 'blob' && item.path.endsWith('.user.js'))
                .map(item => item.path)
                .sort((a, b) => a.localeCompare(b, 'pl'));
            render();
        } catch (err) {
            status.textContent = `Nie udało się pobrać listy (${err.message}). Spróbuj ponownie później lub przejdź do repo: https://github.com/${OWNER}/${REPO}`;
        }
    }

    document.getElementById('search').addEventListener('input', render);
    loadScripts();
</script>
</body>
</html>
